<!doctype html><html lang="az"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AtaPark — KODLAMA</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1c2d46;font:14px Arial,sans-serif}.layout{max-width:1220px;margin:auto;padding:32px 22px}h1{margin:0 0 8px;font-size:27px}p{color:#8290a3;margin:0 0 24px}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:24px 0}.steps button{border:1px solid #e1e8f2;background:white;border-radius:12px;padding:16px 9px;color:#61718a;font-weight:bold;cursor:pointer}.steps button.active{border-color:#3569e7;background:#eff5ff;color:#2456c8}.panel{background:white;border:1px solid #e6edf5;border-radius:14px;padding:26px;margin-bottom:16px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.field label{display:block;font-size:12px;color:#64748b;margin-bottom:8px}input,select{width:100%;height:43px;border:1px solid #dfe7f0;border-radius:9px;background:white;padding:9px 11px;color:#233851}button{cursor:pointer}.controls{display:flex;justify-content:space-between;margin-top:16px}.btn{background:#3268e8;color:white;border:0;padding:12px 19px;border-radius:9px;font-weight:bold}.btn.secondary{background:white;color:#526680;border:1px solid #dfe7f0}.note{background:#eef5ff;border-radius:10px;padding:13px 16px;color:#5b75a4;margin-bottom:22px}.pane{display:none}.pane.active{display:block}.gridtable{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{border-bottom:1px solid #edf1f6;padding:10px;text-align:left}th{background:#f7f9fc;color:#8492a6;font-size:12px}td input{min-width:125px}.review{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.review div{padding:12px;background:#f8fafc;border-radius:9px;font-size:12px;color:#8090a3}.review b{display:block;color:#243751;margin-top:5px;overflow-wrap:anywhere}@media(max-width:800px){.steps{grid-template-columns:repeat(3,1fr)}.fields,.review{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.fields,.review{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}}</style><div class="layout"><h1>AtaPark · Sifariş kodlaşdırılması</h1><p>Excel KODLAMA əsasında 6 mərhələli frontend prototipi</p><div class="steps" id="steps"></div><div id="panes"></div><div class="controls"><button class="btn secondary" onclick="go(-1)">← Geri</button><button class="btn" onclick="go(1)">Növbəti mərhələ →</button></div></div><script>const groups=[["Sifariş","A:№|B:Gün|C:Ay|D:İl|E:Müştəri kodu|F:Sifariş kodu|G:Şirkətin adı|H:Sifariş adı|I:Başlıqsız|BA:Sifariş növü|BL:Təslim tarixi"],["Məhsul","J:Dizayn eni|K:Dizayn uzunluğu|L:Təqribi klişe eni|M:Metrekare|N:Hər paket qr|O:Paket sayı|P:Dizayn sayı|Q:En üzrə yerləşmə|R:Boy üzrə yerləşmə|W:Zed ölçüsü|X:Qazan ölçüsü|AZ:Məhsul növü|BB:İstifadə şəkli"],["Material","T:Material eni|U:Anbardakı xammal|V:Sifariş qalınlığı|Y:Qat sayı|AC:1-ci qat qalınlığı|AD:1-ci material kodu|AE:1-ci density|AF:1-ci 1m=qr|AG:1-ci faiz|AH:1-ci 1kq=m|AL:2-ci material|AM:2-ci qalınlıq|AN:2-ci kod|AO:2-ci density|AP:2-ci 1m=qr|AQ:2-ci faiz|AR:2-ci 1kq=m|AS:3-cü material|AT:3-cü qalınlıq|AU:3-cü kod|AV:3-cü density|AW:3-cü 1m=qr|AX:3-cü faiz|AY:3-cü 1kq=m|BU:Material 1|BV:Material 2|BW:Material 3"],["Çap","S:Rəng sayı|Z:Çap növü|AA:Çap materialı|AB:Cold seal ölçüsü|AI:Rəng tərkibi|AJ:Alt lak|AK:Üst lak|BQ:Klişənin vəziyyəti|BT:Rəng adları"],["Qablaşdırma","BC:Bıçaq növü|BD:Yapışma eni|BE:Yapışma uzunluğu|BF:Perforasiya|BG:Açılış yönü|BH:Başlıqsız BH|BI:Başlıqsız BI|BJ:Başlıqsız BJ|BK:Bobin yönü|BM:Bobin çəki/diametr|BN:Masura ölçüsü|BO:Qablaşdırma şərtləri|BP:1kq=metr|BR:Təsdiq forması|BS:Körük"]],selects={"Y":"-,Tək qat,İki qat,Üç qat","BA":"-,Qablaşdırma,Wraparound,Sticker,Sleeve,Sadə paket,Çörək paketi,Toyuq paketi,Salfetka rolon,Salfetka paketi,Ambalaj","BB":"-,Rulon,Sadə paket,Çörək paketi,Toyuq paketi,Salfetka paketi,Doğranmış,Əl etiketi","BF":"-,Düz,Formalı","BQ":"-,Sağlam,Köhnəlmiş,Yararsiz,Yoxdur,Revize","BO":"-,Streç,Paket,Qutu,Paket və Streç,Paket və Qutu","AK":"-,OPV Parlaq,OPV Mat,Mat lak","AI":"-,Deepfreeze,Slip,Kaydırıcı,Bəyaz Vakslı,Bəyaz Vakssız,Bəyaz Opak,Bəyaz Slikonlu,White-PET-SPT 7700,White-BOPP-SLM 7010","AA":"-,BOPP Şəffaf,KUŞE,BOPP Mat,BOPP Metalizə,BOPP Sədəf,BOPP Cold seal,CPP Şəffaf,CPP Metalizə,CPP Ağ,PET Şəffaf,PET Metalizə,Tvist Şəffaf,Tvist Metalizə,Tvist Ağ,PET Ağ,PVC,PP Şəffaf,PE Şəffaf,PE Ağ,Kağız,Perqament,Falqa","AL":"-,BOPP Şəffaf,BOPP Metalizə,BOPP Sədəf,CPP Şəffaf,CPP Metalizə,CPP Ağ,PET Şəffaf,PET Metalizə,PET Ağ,PE Şəffaf,PE Ağ,Kağız,Falqa,BOPP Mat,Kərə Yağ kağızı,Alüminium falqa,Hohl,Mat lak","AS":"-,BOPP Şəffaf,BOPP Metalizə,BOPP Sədəf,CPP Şəffaf,CPP Metalizə,CPP Ağ,PET Şəffaf,PET Metalizə,PET Ağ,PE Şəffaf,PE Ağ,Kağız,Falqa","V":"12,18,20,23,25,30,32,35,38,40,42,45,50,52,54,55,60,62,64,65,70,72,74,75,80,82,84,85,90,95,100,105,110,115,120,125,130,135,140,145,150,155,160","W":"0,12,18,20,23,25,30,32,35,40,42,45,50,52,54,55,60,62,64,65,70,72,74,75,80,82,84,85,90,95,100,105,110,115,120,125,130,135,140,145,150,155,160","AM":"7,12,15,18,20,23,25,30,32,35,40,42,45,50,52,54,55,60,62,64,65,70,72,74,75,80,82,84,85,90,95,97,100,105,110,114,118,120","AT":"7,12,15,18,20,23,25,30,32,35,40,42,45,50,52,54,55,60,62,64,65,70,72,74,75,80,82,84,85,90,95,97,100,105,110,114,118,120"},unitCols=[["BX","BY","BZ","CA","CB"],["CC","CD","CE","CF","CG"],["CH","CI","CJ","CK","CL"],["CM","CN","CO","CP","CQ"],["CR","CS","CT","CU","CV"],["CW","CX",null,"CY","CZ"],["DA","DB",null,"DC","DD"],["DE","DF",null,"DG","DH"]];let active=0;const fields=groups.map(g=>g[1].split('|').map(x=>x.split(/:(.*)/s).slice(0,2)));fields[3].push(...unitCols.flat().filter(Boolean).map((c,i)=>[c,'Çap vahidi parametri']));function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function field(c,l){const opts=selects[c];return '<div class="field"><label>'+c+' · '+esc(l)+'</label>'+(opts?'<select id="f_'+c+'"><option value="">Seçin</option>'+opts.split(',').map(o=>'<option>'+esc(o)+'</option>').join('')+'</select>':'<input id="f_'+c+'" placeholder="Daxil edin">')+'</div>'}document.getElementById('steps').innerHTML=[...groups.map(x=>x[0]),'Yekun'].map((s,i)=>'<button onclick="show('+i+')">'+(i+1)+'. '+s+'</button>').join('');document.getElementById('panes').innerHTML=groups.map((g,i)=>'<section class="panel pane"><h2>'+g[0]+'</h2><div class="note">KODLAMA vərəqindəki sütunlar. Excel-də müxtəlif sətrlər üçün fərqli seçim siyahıları ola bilər.</div><div class="fields">'+fields[i].map(([c,l])=>field(c,l)).join('')+'</div></section>').join('')+'<section class="panel pane"><h2>Yekun baxış</h2><div class="review" id="review"></div><p style="margin-top:18px">Demo rejimi — məlumatlar serverə göndərilmir.</p></section>';function show(i){active=Math.max(0,Math.min(5,i));document.querySelectorAll('.pane').forEach((x,j)=>x.classList.toggle('active',j===active));document.querySelectorAll('.steps button').forEach((x,j)=>x.classList.toggle('active',j===active));if(active===5)document.getElementById('review').innerHTML=fields.flat().map(([c,l])=>'<div>'+esc(c+' · '+l)+'<b>'+esc(document.getElementById('f_'+c)?.value||'—')+'</b></div>').join('');window.scrollTo({top:0,behavior:'smooth'})}function go(d){show(active+d)}try{const saved=JSON.parse(sessionStorage.getItem('atapark-kodlama')||'{}');Object.entries(saved).forEach(([k,v])=>{const el=document.getElementById('f_'+k);if(el)el.value=v})}catch(e){}document.addEventListener('change',()=>{const obj={};document.querySelectorAll('[id^="f_"]').forEach(el=>obj[el.id.slice(2)]=el.value);sessionStorage.setItem('atapark-kodlama',JSON.stringify(obj))});show(0);</script><script>(function(){const corrected={"AZ":"-,Boru,Açıq","Z":"-,Alt Çap,Üst Çap,Çapsız","BN":"-,40 mm,76 mm,125 mm,152 mm","BM":"18 ,15kq,20kq,25kq,30kq,35kq,30sm,40sm,50sm,36 SM,32 sm","BR":"-,Müştəri gələcək,Pantone ilə,Göndərilən nümunə,Satış nümayəndəsi,Şəkil ilə,Müştəriyə göndəriləcək,Kromalin ilə,Keyfiyyət","AD":"-,Deepfreeze,Slip,Kaydırıcı,Bəyaz Vakslı,Bəyaz Vakssız,Bəyaz Opak,Bəyaz Slikonlu,White-PET-SPT 7700,White-BOPP-SLM 7010","X":"0,370,380,400,430,420,440,450,480,500,510,530,540,550,570,580,600,610,620,640,660,680,700","AC":"12,18,20,23,25,30,32,35,38,40,42,45,50,52,54,55,60,62,64,65,70,72,74,75,80,82,84,85,90,95,100,105,110,115,120,125,130,135,140,145,150,155,160","AM":"15,12,18,20,23,25,30,32,35,40,42,45,50,52,54,55,60,62,64,65,70,72,74,75,80,82,84,85,90,95,97,100,105,110,114,118,120,7","AT":"15,12,18,20,23,25,30,32,35,40,42,45,50,52,54,55,60,62,64,65,70,72,74,75,80,82,84,85,90,95,97,100,105,110,114,118,120,7"};for(const [col,values] of Object.entries(corrected)){const el=document.getElementById('f_'+col);if(!el)continue;const sel=document.createElement('select');sel.id=el.id;sel.innerHTML='<option value="">Seçin</option>'+values.split(',').map(v=>{const op=document.createElement('option');op.textContent=v;return op.outerHTML}).join('');sel.value=el.value;el.replaceWith(sel)}const titles=['Sifariş','Məhsul və ölçülər','Material və laminasiya','Çap və rənglər','Qablaşdırma','Yekun baxış'];document.querySelectorAll('#steps button').forEach((b,i)=>b.textContent=(i+1)+'. '+titles[i]);})();</script></html>
