<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AtaPark ERP — Sifariş kodlaması</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1c2733;--mute:#66758a;--line:#d5dbe2;--acc:#0b6e8a;--c:#0aa3c2;--m:#d6336c;--y:#f2b705;--k:#1c2733}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Roboto,system-ui,sans-serif}
header{padding:22px 28px 6px;max-width:1280px;margin:auto}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--mute)}
.wrap{max-width:1280px;margin:auto;padding:16px 28px 48px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:16px;padding:18px 20px 20px;border-left:5px solid var(--c)}
section:nth-of-type(4n+2){border-left-color:var(--m)}
section:nth-of-type(4n+3){border-left-color:var(--y)}
section:nth-of-type(4n){border-left-color:var(--k)}
h2{font-size:16px;margin:0 0 14px}
h3{font-size:13px;margin:16px 0 8px;color:var(--mute);font-weight:600}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 14px}
.w2{grid-column:span 2}.w3{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
input,select{width:100%;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font:inherit}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
.ck{display:flex;gap:8px;flex-wrap:wrap}
.ck label{display:flex;align-items:center;gap:6px;margin:0;padding:6px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink);cursor:pointer}
.ck input{width:auto;height:auto}
.ro{background:#f5f7f9}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:12px;color:var(--mute);font-weight:600;text-align:left;padding:0 6px 6px}
td{padding:3px 6px}td:first-child{font-weight:600;white-space:nowrap}
aside{position:sticky;top:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
aside h2{margin-bottom:10px}
dl{margin:0}
dl div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
dt{color:var(--mute)}dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.mat{font-size:12.5px;margin:0 0 6px;padding:6px 8px;background:#f5f7f9;border-radius:6px;word-break:break-word}
.btns{display:grid;gap:8px;margin-top:16px}
button{height:40px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#msg{min-height:18px;margin-top:8px;color:var(--acc);font-size:13px}
@media(max-width:960px){.wrap{grid-template-columns:1fr;padding:12px 14px 40px}aside{position:static}header{padding:18px 14px 0}.w2{grid-column:auto}}

@media(min-width:961px){aside{top:20px;max-height:calc(100vh - 40px);overflow:auto}} 
section{box-shadow:0 3px 14px rgba(25,39,60,.035)}
input:read-only{background:#f4f6f8}
</style>
</head>
<body>
<header><h1>Sifariş kodlaması</h1><p>AtaPark ERP · Excel KODLAMA strukturuna əsaslanan sifariş forması</p></header>
<form class="wrap" id="f" autocomplete="off" onsubmit="return false">
<main id="main"></main>
<aside>
<h2>Hesablamalar</h2>
<dl id="out"></dl>
<h3>Material</h3>
<p class="mat" id="m1"></p><p class="mat" id="m2"></p><p class="mat" id="m3"></p>
<div class="btns"><button type="button" class="p" id="dl">JSON kimi yüklə</button><button type="button" id="cp">JSON kopyala</button><button type="button" id="rs">Formanı təmizlə</button></div>
<div id="msg" role="status"></div>
</aside>
</form>
<script>
const MAT=["-","BOPP Şəffaf","BOPP Mat","BOPP Metalizə","BOPP Sədəf","BOPP Cold seal","CPP Şəffaf","CPP Metalizə","CPP Ağ","PET Şəffaf","PET Mat","PET Metalizə","PET Tvist Şəffaf","PET Tvist Metalizə","PET Tvist Ağ","PET opak","PVC","PP Şəffaf","PP OPAK","PP Metalizə","PE Şəffaf","PE Ağ","PLEN","PETG","PETG Şəffaf","PETG Ağ","ULTRA Clear","KUŞE","Şərab kağızı","TOP TERMAL","Dərman kağızı","TSHL","Kağız","Perqament","Falqa","Margarin yağ kağızı","Kərə yağ kağızı","PE Shrink","Mix pup","OPS","OPP Metalizə","Polietilen Mat","Hohl"];
const LAM=["-","BOPP Şəffaf","BOPP Mat","BOPP Metalizə","BOPP Sədəf","CPP Şəffaf","CPP Metalizə","CPP Ağ","PET Şəffaf","PET Metalizə","PET Ağ","PE Şəffaf","PE Ağ","Politelin","Politelin Bəyaz","Polietilen Bəyaz","Kağız","Falqa","Alüminium falqa","Kərə yağ kağızı","Hohl","Mat lak","Baryer film","PA film"];
const MIC=[12,18,20,23,25,28,30,32,33,35,38,39,40,42,44,45,49,50,52,54,55,57,60,62,64,65,70,72,74,75,80,82,84,85,90,94,95,97,100,102,105,110,115,120,125,130,135,140,145,150,155,160];
const QZ=[0,370,380,390,400,420,430,440,450,480,500,510,530,540,550,570,580,600,610,620,640,660,680,700];
const D=["-"],dash=a=>["-",...a];
// [kol, ad, tip, seçimlər/əlavə, genişlik]  tip: t mətn, n ədəd, s seçim, d tarix, r hesablanan, ck çoxlu seçim
const S=[
["Müştəri və sifariş",[
["B","Sifariş tarixi","d"],["A","№ (sıra)","n"],["E","Müştəri kodu","t"],["SEQ","Müştəri üzrə sıra №","n"],["F","Sifariş kodu","t"],
["G","Şirkətin adı","t","","w2"],["H","Sifariş adı","t","","w2"]]],
["Ölçülər",[
["J","Dizayn eni (mm)","n"],["K","Dizayn uzunluğu (mm)","n"],["L","Təqribi klişə eni","n"],["P","Hər dizayn sayı","n"],
["Q","En üzrə say (YY)","n"],["R","Boy üzrə say (AA)","n"],["S","Rəng sayı","s",dash(["1","2","3","4","5","6","7","8","2+1","3+1","4+1","5+1","6+1","7+1","4+2"])],
["T","Materialın eni (mm)","n"],["U","Anbardakı xammal","n"],["V","Sifariş qalınlığı (mic)","s",MIC],["W","Zed ölçüsü","n"],["X","Qazan ölçüsü","s",QZ]]],
["Çap və material",[
["Y","Qat sayı","s",dash(["Tək qat","İki qat","Üç qat"])],["Z","Çap növü","s",dash(["Üst Çap","Alt Çap","Çapsız"])],
["AA","Çap materialının növü","s",MAT,"w2"],["AB","Cold seal ölçü (sm)","n"],["AC","Qalınlıq 1 (mic)","s",MIC],["AD","Xammalın kodu","t"],
["AE","Density","n"],["AI","Rəng tərkibi","s",dash(["Deepfreeze","Slip","Kaydırıcı","Bəyaz Vakslı","Bəyaz Vakssız","Bəyaz Opak","Bəyaz Slikonlu","White-PET-SPT 7700","White-BOPP-SLM 7010"]),"w2"],
["AJ","Alt lak","s",dash(["Primer"])],["AK","Üst lak","s",dash(["OPV Parlaq","OPV Mat"])]]],
["Laminasiya",[
["h","Laminasiya 1"],
["AL","Materialın növü","s",LAM,"w2"],["AM","Qalınlıq 2 (mic)","s",MIC],["AN","Xammalın kodu","t"],["AO","Density","n"],
["h","Laminasiya 2"],
["AS","Materialın növü","s",LAM,"w2"],["AT","Qalınlıq 3 (mic)","s",MIC],["AU","Xammalın kodu","t"],["AV","Density","n"]]],
["Məhsul və qablaşdırma",[
["AZ","Məhsul növü","s",dash(["Açıq","Boru"])],["BA","Sifariş növü","s",dash(["Sticker","Sleeve","Etiket","Ambalaj","Wraparound","Sadə paket","Çörək paketi"])],
["BB","İstifadə şəkli","s",dash(["Rulon","Əl etiketi","Çörək paketi","Sadə paket"])],["BC","Bıçaq növü","s",dash(["Taxta","Manyetik","Tabaka"])],
["BD","Yapışma eni (mm)","n"],["BE","Yapışma uzunluğu (mm)","n"],["BF","Perforasiya","s",dash(["Düz","Formalı"])],
["BG","Açılış yönü","ck",["1","2","3","4"]],
["BK","Bobin yönü","s",dash(["Üstə","Altdə"])],["BL","Təslim tarixi","d"],["BM","Bobin çəki / diameter","t"],
["BN","Masura ölçüsü","s",dash(["40 mm","76 mm","78 mm","125 mm","152 mm"])],["BO","Qablaşdırma şərtləri","s",dash(["Streç","Qutu","Paket","Paket və Qutu"])],
["BQ","Klişənin vəziyyəti","s",dash(["Sağlam","Köhnəlmiş","Yararsız","Yoxdur","Revize"])],
["BR","Təsdiq forması","s",dash(["Müştəri gələcək","Şəkil ilə","Satış nümayəndəsi","Satış təsdiqi","Göndərilən nümunə","Keyfiyyət meneceri","Müştəriyə göndəriləcək","Kromalin ilə"])],
["BS","Körük (sm)","n"],["BT","Rəng adları","t","","w2"]]]
];
const UF=[["r","Rəng"],["q","Tərkib miqdarı"],["t","Tesa"],["a","Anilox"],["v","Viscose"]];
const $=id=>document.getElementById(id),main=$("main");
const el=(c)=>document.querySelector(`[data-c="${c}"]`);
function field(x){
 const [c,l,t,o,w]=x;let h=`<div class="${w||""}${t=="ck"?" w3":""}"><label>${l}</label>`;
 if(t=="s")h+=`<select data-c="${c}">${o.map(v=>`<option>${v}</option>`).join("")}</select>`;
 else if(t=="ck")h+=`<div class="ck">${o.map(v=>`<label><input type="checkbox" data-c="${c}" value="${v}">${v}</label>`).join("")}</div>`;
 else h+=`<input data-c="${c}" ${t=="n"?'type="number" step="any" min="0"':t=="d"?'type="date"':t=="r"?'readonly class="ro"':'type="text"'}>`;
 return h+"</div>";
}
main.innerHTML=S.map(([n,fs])=>`<section><h2>${n}</h2><div class="g">${fs.map(x=>x[0]=="h"?`<h3 class="w3">${x[1]}</h3>`:field(x)).join("")}</div></section>`).join("")+
`<section><h2>Çap hazırlıqları</h2><div class="tw"><table><thead><tr><th>Unit</th>${UF.map(f=>`<th>${f[1]}</th>`).join("")}</tr></thead><tbody>${
[1,2,3,4,5,6,7,8].map(u=>`<tr><td>Unit ${u}</td>${UF.map(f=>`<td>${u>5&&f[0]=="t"?"":`<input data-c="u${u}${f[0]}" data-l="unit ${u} — ${f[1]}" type="${f[0]=="a"||f[0]=="t"?"number":"text"}" step="any">`}</td>`).join("")}</tr>`).join("")
}</tbody></table></div></section>`;
// labellar
const LB={};S.forEach(s=>s[1].forEach(x=>{if(x[0]!="h")LB[x[0]]=x[1]}));
document.querySelectorAll("[data-c]").forEach(e=>{if(e.dataset.l)LB[e.dataset.c]=e.dataset.l});
// density
/* Nümunə sıxlıqlar: istehsal təsdiqi olmadan avtomatik tətbiq edilməsin. */
const DEN={"PET Şəffaf":1.4,"PET Mat":1.35,"PET Metalizə":1.4,"BOPP Sədəf":.72,"BOPP Şəffaf":.85,"BOPP Mat":.84,"-":0};
const dens=m=>m in DEN?DEN[m]:"";
const num=c=>{const e=el(c);return e?parseFloat(e.value)||0:0};
const val=c=>{const e=el(c);return e?e.value:""};
const fmt=n=>isFinite(n)?String(+n.toFixed(4)):"—";
const sets=[["AA","AE"],["AL","AO"],["AS","AV"]];
sets.forEach(([m,d])=>{el(m).addEventListener("change",()=>{el(d).value=dens(val(m));delete el(d).dataset.man;calc()});el(d).addEventListener("input",()=>{el(d).dataset.man=1})});
function calc(){
 /* Sifariş kodu biznes qaydası təsdiqlənənədək əl ilə daxil edilir. */
 const m2=num("J")*num("K")/1000000,pk=m2*num("V")*num("AE");
 const T=num("T"),w=(mic,d)=>T*mic*d/1000;
 const a=w(num("AC"),num("AE")),b=w(num("AM"),num("AO")),c=w(num("AT"),num("AV")),s=a+b+c;
 const inv=x=>x?1000/x:NaN;
 const rows=[["Bir dizayn sahəsi (m²)",m2],["Bir dizayn təxmini çəkisi (qr)",pk],["1 kq-da dizayn sayı (təxmini)",inv(pk)],["1 m = qr (material 1)",a],["1 m = qr (lam. 1)",b],["1 m = qr (lam. 2)",c],
 ["Material 1, %",s?a*100/s:NaN],["Lam. 1, %",s?b*100/s:NaN],["Lam. 2, %",s?c*100/s:NaN],["1 kq = m (ümumi)",inv(s)]];
 $("out").innerHTML=rows.map(r=>`<div><dt>${r[0]}</dt><dd>${fmt(r[1])}</dd></div>`).join("");
 const ms=(m,mic)=>`${val(m)||"-"} ${num(mic)} mic ${T} mm`;
 $("m1").textContent="Material-1: "+ms("AA","AC");$("m2").textContent="Material-2: "+ms("AL","AM");$("m3").textContent="Material-3: "+ms("AS","AT");
}
function collect(){
 const o={},d=val("B");
 if(d){const[p,q,r]=d.split("-");o["Sifariş tarixi"]={gün:r,ay:q,il:p}}
 document.querySelectorAll("[data-c]").forEach(e=>{const c=e.dataset.c;if(c=="B"||e.type=="checkbox")return;o[c+" — "+(LB[c]||c)]=e.value});
 o["Açılış yönü"]=[...document.querySelectorAll('[data-c="BG"]:checked')].map(e=>e.value);
 document.querySelectorAll("#out div").forEach(r=>o["Hesab: "+r.children[0].textContent]=r.children[1].textContent);
 ["m1","m2","m3"].forEach(i=>o[$(i).textContent.split(":")[0]]=$(i).textContent.split(": ")[1]);
 return JSON.stringify(o,null,2);
}
const say=t=>{$("msg").textContent=t;setTimeout(()=>$("msg").textContent="",3000)};
$("f").addEventListener("input",calc);$("f").addEventListener("change",calc);
$("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([collect()],{type:"application/json"}));a.download="sifaris-"+(val("F")||"yeni")+".json";a.click();say("Fayl yükləndi")};
$("cp").onclick=()=>navigator.clipboard.writeText(collect()).then(()=>say("Kopyalandı"),()=>say("Kopyalamaq alınmadı"));
$("rs").onclick=()=>{$("f").reset();calc();say("Forma təmizləndi")};
const today=new Date();el("B").value=[today.getFullYear(),String(today.getMonth()+1).padStart(2,"0"),String(today.getDate()).padStart(2,"0")].join("-");calc();
</script>
</body>
</html>
